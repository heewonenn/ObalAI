services:
  - type: web
    name: obalai-demo
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port "$PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: obalai-demo-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true

databases:
  - name: obalai-demo-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    ipAllowList: []
